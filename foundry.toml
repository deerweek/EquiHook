[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true
via_ir = true

[rpc_endpoints]
xlayer_testnet = "${X_LAYER_TESTNET_RPC}"
xlayer_mainnet = "https://rpc.xlayer.tech"

[etherscan]
xlayer_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://www.oklink.com/xlayer" }
